<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vonoa Web</title>

<!-- Red de seguridad si el visitante trae JavaScript desactivado. -->
<meta http-equiv="refresh" content="3;url=https://vonoaweb.com/?utm_source=qr&utm_medium=impreso&utm_campaign=qr-impreso-2026">

<style>
  :root { color-scheme: dark; }
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#070F21;color:#FFFFFF;
    font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
    text-align:center;padding:24px;
  }
  .caja{max-width:340px}
  .anillo{
    width:46px;height:46px;margin:0 auto 22px;border-radius:50%;
    background:conic-gradient(from 0deg,#2EE9B9,#1CA0F4,#2EE9B9);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0);
            mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0);
    animation:girar .9s linear infinite;
  }
  @keyframes girar{to{transform:rotate(1turn)}}
  @media (prefers-reduced-motion:reduce){.anillo{animation:none}}
  p{margin:0;font-size:15px;color:#94A3B8;line-height:1.5}
  a{color:#2EE9B9;text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="caja">
    <div class="anillo" aria-hidden="true"></div>
    <p>Te estamos llevando a Vonoa&hellip;<br>
       <a href="https://vonoaweb.com/?utm_source=qr&utm_medium=impreso&utm_campaign=qr-impreso-2026">Continuar ahora</a></p>
  </div>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3KN5E8EFG2"></script>
<script>
/* Ajustes de esta redireccion. Editables a mano sin regenerar el QR:
   el codigo impreso apunta a esta URL, no al destino final. */
var CONFIG = {
  destino:  "https://vonoaweb.com/?utm_source=qr&utm_medium=impreso&utm_campaign=qr-impreso-2026",
  slug:     "impreso",
  medio:    "impreso",
  campana:  "qr-impreso-2026",
  ga4:      "G-3KN5E8EFG2",

  /* Contador propio del lado del servidor. Dejalo vacio para usar solo GA4.
     Cuando montes el backend, pon aqui su URL (ej. "https://vonoaweb.com/api/qr")
     y esta pagina empezara a reportarle sin que reimprimas nada. */
  endpointContador: "",

  /* Cuanto esperamos como maximo a que GA4 confirme antes de redirigir. */
  esperaMaxMs: 1200
};

/* OJO: gtag se declara sobre window a proposito. Declararlo como
   "function gtag(){}" dentro de un IIFE lo deja en scope local y
   window.gtag nunca existe: ese fue el bug que dejo el sitio en
   0 conversiones hasta agosto 2026. No lo cambies. */
window.dataLayer = window.dataLayer || [];
window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };

var yaRedirigio = false;
function irAlDestino(){
  if (yaRedirigio) return;
  yaRedirigio = true;
  /* replace() y no href: evita que el boton "atras" devuelva a esta pagina. */
  window.location.replace(CONFIG.destino);
}

/* 1. Contador propio (si esta configurado). sendBeacon sobrevive a la
      redireccion y no bloquea la navegacion. */
if (CONFIG.endpointContador && navigator.sendBeacon) {
  try {
    navigator.sendBeacon(CONFIG.endpointContador, new Blob([JSON.stringify({
      slug: CONFIG.slug, medio: CONFIG.medio, campana: CONFIG.campana,
      ts: Date.now(), ref: document.referrer || null
    })], { type: "application/json" }));
  } catch (e) { /* nunca dejamos que el contador rompa la redireccion */ }
}

/* 2. Evento en GA4. */
gtag('js', new Date());
gtag('config', CONFIG.ga4, { send_page_view: false, transport_type: 'beacon' });
gtag('event', 'qr_scan', {
  qr_slug:    CONFIG.slug,
  qr_medio:   CONFIG.medio,
  qr_campana: CONFIG.campana,
  event_callback: irAlDestino,
  event_timeout:  CONFIG.esperaMaxMs
});

/* 3. Salvavidas: si GA4 esta bloqueado por un ad blocker el callback
      nunca llega, asi que redirigimos igual al vencer el plazo. */
setTimeout(irAlDestino, CONFIG.esperaMaxMs);
</script>
</body>
</html>
